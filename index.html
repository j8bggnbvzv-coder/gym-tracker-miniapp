etween;align-items:center;margin-top:9px}.add-set{border:none;background:none;color:var(--accent);font-size:12px;font-weight:800;padding:6px 0}.small-icon-btn{background:transparent;border:0;color:var(--muted);padding:6px;display:grid;place-items:center}.workout-sticky{position:sticky;bottom:calc(85px + var(--safe-bottom));z-index:5;padding:11px 0 0;background:linear-gradient(transparent,var(--bg) 22%)}.note{font-size:11px;color:var(--muted);line-height:1.5}.history-details{border-top:1px solid var(--stroke);padding:14px 2px 0;margin-top:13px}.detail-row{display:flex;align-items:flex-start;justify-content:space-between;font-size:12px;padding:7px 0;gap:8px}.detail-row strong{font-size:12px}.progress-track{height:8px;background:#34412e;border-radius:8px;overflow:hidden}.progress-fill{background:var(--accent);height:100%;border-radius:8px}.pr-list{display:grid;gap:10px}.pr-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:var(--card2);border-radius:12px;gap:10px}.pr-item .value{font-size:15px;font-weight:850;color:var(--accent);white-space:nowrap}.select{width:100%;background:var(--card2);border:1px solid var(--stroke);border-radius:12px;padding:12px 13px;font-size:13px;color:var(--text);margin-top:12px}.progress-chart{display:block;width:100%;height:auto;min-height:156px;margin-top:15px}.progress-chart text{fill:var(--muted);font-family:inherit;font-size:10px}.progress-chart .axis{stroke:#3b4858;stroke-width:1;stroke-dasharray:4 5}.progress-chart .area{fill:rgba(194,250,101,.09)}.progress-chart .line{stroke:var(--accent);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}.progress-chart .dot{fill:var(--accent);stroke:var(--card);stroke-width:3}
    .tabbar{position:fixed;z-index:20;bottom:0;left:0;right:0;margin:auto;max-width:540px;background:#101721ed;backdrop-filter:blur(19px);-webkit-backdrop-filter:blur(19px);border-top:1px solid var(--stroke);display:grid;grid-template-columns:repeat(4,1fr);padding:11px 9px calc(12px + var(--safe-bottom));gap:2px}.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:700;padding:4px 0}.tab svg{width:22px;height:22px}.tab.active{color:var(--accent)}.tab.active .tab-icon{background:#2a3729}.tab-icon{width:43px;height:32px;display:grid;place-items:center;border-radius:10px}.modal-backdrop{position:fixed;z-index:30;inset:0;background:#05070bd0;display:flex;align-items:flex-end;justify-content:center}.sheet{max-width:540px;width:100%;max-height:85dvh;background:#18202b;border:1px solid var(--stroke);border-radius:26px 26px 0 0;padding:22px 18px calc(20px + var(--safe-bottom));overflow:auto}.sheet-handle{width:41px;height:4px;background:#586270;border-radius:9px;margin:-9px auto 19px}.sheet-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 2px;border:0;border-bottom:1px solid var(--stroke);background:transparent;color:var(--text);text-align:left}.field{background:var(--bg);border:1px solid var(--stroke);border-radius:12px;width:100%;padding:13px;margin:10px 0;font-size:15px}.label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.settings-row{padding:15px 0;border-bottom:1px solid var(--stroke)}.settings-row:last-child{border:none}.settings-row strong{display:block}.settings-row small{display:block;color:var(--muted);font-size:11px;margin:5px 0 10px}.backup-input{width:100%;resize:vertical;height:88px;background:var(--bg);border:1px solid var(--stroke);border-radius:12px;padding:10px;font:11px/1.4 ui-monospace,monospace}.toast{position:fixed;bottom:calc(94px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:#33402f;color:#eaffdc;border:1px solid #4c5c44;border-radius:13px;padding:12px 16px;font-size:12px;z-index:50;max-width:calc(100% - 40px);width:max-content;box-shadow:0 10px 24px #0008;text-align:center}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
    /* Enhancements for training in the gym: rest timer + previous workout details */
    .rest-panel{border:1px solid #45633a;background:linear-gradient(125deg,#243225,#18251d);border-radius:18px;padding:14px;margin:0 0 14px}
    .rest-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
    .rest-label{font-weight:850;font-size:13px}
    .rest-time{color:var(--accent);font-size:23px;font-weight:900;letter-spacing:-.7px;font-variant-numeric:tabular-nums}
    .rest-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .rest-controls button{min-height:39px;border:1px solid #43553f;border-radius:10px;background:#263827;color:#e8fae1;font-size:12px;font-weight:800}
    .rest-controls button.active{background:var(--accent);color:#132010;border-color:var(--accent)}
    .rest-actions{display:flex;align-items:center;gap:7px;margin-top:9px}
    .rest-actions button{flex:1;min-height:35px;background:#1a2b21;border:1px solid #40533c;color:#d3ebc3;border-radius:10px;font-size:12px;font-weight:700}
    .previous-set{margin:-3px 0 12px;padding:9px 10px;border-radius:10px;background:#263325;color:#b6d69e;font-size:11px;line-height:1.55}
    .exercise-actions .reuse{border:0;background:#2b3928;color:var(--accent);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}
    .exercise-actions{flex-wrap:wrap;gap:7px}
    .exercise-search-empty{font-size:12px;color:var(--muted);padding:15px 0}
    .session-title-tools{display:flex;gap:5px;align-items:center;margin-top:6px;flex-wrap:wrap}

<body>
<div id="app"><header id="header"></header><main id="main"></main></div>
<nav class="tabbar" id="tabbar" aria-label="Разделы приложения"></nav>
<div id="modal" class="hidden"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
 const DB='gym_tracker_v1';
 const REST_DB='gym_tracker_rest_until_v1';
 const tg=window.Telegram&&window.Telegram.WebApp;
 try{if(tg){tg.ready();tg.expand();tg.setHeaderColor('#0b1018');tg.setBackgroundColor('#0b1018');}}catch(e){}
 const pathIcons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',dumbbell:'<path d="m6.5 6.5 11 11M3 8l5-5m8 13 5-5M2 10l8-8m4 20 8-8M5 13l6-6m2 12 6-6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',chart:'<path d="M3 3v18h18M7 16l4-5 4 3 5-8"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13.5a1.5 1.5 0 0 0 .3 1.65l.1.1-1.6 2.8-.2-.07a1.5 1.5 0 0 0-1.6.55l-.15.2H9.2l-.15-.2a1.5 1.5 0 0 0-1.6-.55l-.2.07-1.6-2.8.1-.1a1.5 1.5 0 0 0 .3-1.65v-3a1.5 1.5 0 0 0-.3-1.65l-.1-.1 1.6-2.8.2.07a1.5 1.5 0 0 0 1.6-.55l.15-.2h5.65l.15.2a1.5 1.5 0 0 0 1.6.55l.2-.07 1.6 2.8-.1.1a1.5 1.5 0 0 0-.3 1.65z"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',trash:'<path d="M4 7h16M10 3h4m-8 4 1 14h10l1-14M10 11v6m4-6v6"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-7z"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4ZM7 6H4v3a4 4 0 0 0 4 4m9-7h3v3a4 4 0 0 1-4 4"/>',arrow:'<path d="m9 18 6-6-6-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',layers:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 9h10M7 14h10"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>',pause:'<path d="M8 5v14M16 5v14"/>'};
 const ico=(name)=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${pathIcons[name]||pathIcons.dumbbell}</svg>`;
 const options=['Жим в тренажёре','Тяга верхнего блока','Горизонтальная тяга','Разведения гантелей в стороны','Сгибание рук с гантелями','Разгибание рук на блоке','Жим гантелей сидя','Приседания со штангой','Жим ногами','Разгибание ног','Сгибание ног','Подъёмы на носки','Отжимания','Подтягивания','Скручивания','Планка','Тяга гантели одной рукой','Разводка в тренажёре'];
 const presets=[{name:'Верх тела',desc:'Грудь, спина, плечи, руки',icon:'dumbbell',items:[0,1,2,3,4,5]},{name:'Низ тела',desc:'Квадрицепс, бицепс бедра, икры',icon:'bolt',items:[7,8,10,11]},{name:'Всё тело',desc:'Силовая на основные группы',icon:'layers',items:[0,1,8,3,10]},{name:'Своя тренировка',desc:'Начни с чистого листа',icon:'plus',items:[]}];
 let storageOk=true;
 function load(){try{const r=JSON.parse(localStorage.getItem(DB));if(r&&r.version===1&&Array.isArray(r.sessions))return {version:1,sessions:r.sessions,active:r.active||null};}catch(e){}return {version:1,sessions:[],active:null};}
 let data=load(),page='home',expandedId='',progressExercise='',modalMode='',toastTimer=0;
 let restEnd=0,restDuration=90,restWasRunning=false;
 try{restEnd=Number(localStorage.getItem(REST_DB))||0;}catch(e){}
 if(restEnd<=Date.now())restEnd=0;
 function persist(){try{localStorage.setItem(DB,JSON.stringify(data));storageOk=true;}catch(e){storageOk=false;notify('Нет доступа к памяти: экспортируй данные, чтобы не потерять их');}}
 const id=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
 const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmtDate=s=>new Date(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
 const fmtFull=s=>new Date(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
 const fmtTime=s=>new Date(s).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
 const fmtNum=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);
 const formatVolume=n=>n>=1000?fmtNum(n/1000)+' т':fmtNum(n)+' кг';
 const validSet=s=>Number.isFinite(Number(s.weight))&&s.weight!==''&&Number(s.weight)>=0&&s.reps!==''&&Number.isFinite(Number(s.reps))&&Number(s.reps)>0;
 const setsOf=w=>(w.exercises||[]).flatMap(e=>e.sets||[]).filter(validSet);
 const volume=w=>setsOf(w).reduce((a,s)=>a+Number(s.weight)*Number(s.reps),0);
 const completedWorkouts=()=>data.sessions.filter(s=>Array.isArray(s.exercises));
 function previousExercise(name){for(const w of data.sessions){const ex=(w.exercises||[]).find(e=>e.name.toLocaleLowerCase('ru')===name.toLocaleLowerCase('ru'));if(ex&&ex.sets&&ex.sets.some(validSet))return {ex,date:w.finishedAt};}return null;}
 function restRemaining(){return Math.max(0,Math.ceil((restEnd-Date.now())/1000))}
 function restClock(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
 function storeRest(){try{localStorage.setItem(REST_DB,String(restEnd))}catch(e){}}
 function beginRest(sec){restEnd=Date.now()+sec*1000;restDuration=sec;restWasRunning=true;storeRest();syncRestTimer();haptic();}
 function stopRest(){restEnd=0;restWasRunning=false;storeRest();syncRestTimer();}
 function syncRestTimer(){const t=document.getElementById('restTime');if(!t)return;const sec=restRemaining();t.textContent=sec?restClock(sec):'00:00';const state=document.getElementById('restStatus');if(state)state.textContent=sec?'Восстанавливай силы':'Выбери время для отдыха';for(const b of document.querySelectorAll('[data-action="rest-start"]'))b.classList.toggle('active',sec>0&&Number(b.dataset.seconds)===restDuration);}
 setInterval(()=>{if(restEnd&&restRemaining()===0){restEnd=0;storeRest();if(restWasRunning){restWasRunning=false;notify('Отдых окончен — следующий подход!');haptic('heavy');}}syncRestTimer();},1000);
 function notify(t){const box=document.getElementById('toast');box.textContent=t;box.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.add('hidden'),2800);}
 function haptic(type='light'){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(type)}catch(e){}}
 function validateWorkouts(obj){if(!obj||obj.version!==1||!Array.isArray(obj.sessions)||obj.sessions.length>5000)throw Error('Некорректный формат файла');for(const w of obj.sessions){if(typeof w.name!=='string'||typeof w.finishedAt!=='string'||!Array.isArray(w.exercises)||w.exercises.length>100)throw Error('Повреждённые записи');for(const ex of w.exercises){if(typeof ex.name!=='string'||!Array.isArray(ex.sets)||ex.sets.length>100)throw Error('Неверный формат упражнений');for(const s of ex.sets){if(!validSet(s)||Number(s.weight)>100000||Number(s.reps)>100000)throw Error('Некорректные подходы');}}}}
 function trendBars(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(6-i));return d});const counts=days.map(d=>data.sessions.filter(s=>{const x=new Date(s.finishedAt);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()&&x.getDate()===d.getDate()}).length);const max=Math.max(1,...counts);const names=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];return `<div class="chart">${days.map((d,i)=>`<div class="chart-col"><div class="chart-bar-wrap"><div class="chart-bar" style="height:${counts[i]?Math.max(13,(counts[i]/max)*95):0}%" title="${counts[i]} тренировок"></div></div><small>${names[d.getDay()]}</small></div>`).join('')}</div>`}
 function home(){const sessions=completedWorkouts(),count=sessions.length;const vol=sessions.reduce((a,w)=>a+volume(w),0);const last7=sessions.filter(w=>Date.now()-new Date(w.finishedAt).getTime()<7*86400000).length;const allSets=sessions.reduce((a,w)=>a+setsOf(w).length,0);return `<div class="eyebrow">ТВОЯ СИЛА — ТВОЯ ИСТОРИЯ</div><h1>Прогресс начинается здесь.</h1><p class="subtitle">Фиксируй каждый подход. Становись сильнее.</p><section class="hero"><div class="hero-label">GYM TRACKER / ACTIVE MODE</div><h2>${data.active?'Продолжай тренировку!':'Готов к новой тренировке?'}</h2><button class="btn" data-action="nav" data-page="workout">${ico('plus')} ${data.active?'Продолжить':'Начать тренировку'}</button><div class="hero-count"><strong>${count}</strong><small>ТРЕНИРОВОК ВСЕГО</small></div></section><div class="section-title"><h2>Твоя статистика</h2><span class="tiny">За всё время</span></div><div class="stats"><div class="stat"><div class="stat-icon">${ico('dumbbell')}</div><strong>${count}</strong><small>тренировок</small></div><div class="stat"><div class="stat-icon">${ico('bolt')}</div><strong>${formatVolume(vol)}</strong><small>общий тоннаж</small></div><div class="stat"><div class="stat-icon">${ico('calendar')}</div><strong>${last7}</strong><small>за последние 7 дней</small></div><div class="stat"><div class="stat-icon">${ico('check')}</div><strong>${allSets}</strong><small>рабочих подходов</small></div></div><div class="section-title"><h2>Активность</h2><span class="tiny">7 дней</span></div><div class="panel">${trendBars()}</div><div class="section-title"><h2>Последние тренировки</h2><button class="muted-link" data-action="nav" data-page="history">Все ${ico('arrow')}</button></div><div class="panel">${sessions.length?sessions.slice(0,3).map(logItem).join(''):`<div class="empty"><div class="empty-icon">${ico('dumbbell')}</div><h3>Пока нет тренировок</h3><p>Начни первую — и здесь появится твоя статистика.</p><button class="btn btn-primary mini-btn" data-action="nav" data-page="workout">Начать ${ico('arrow')}</button></div>`}</div>`}
 function logItem(w){return `<div class="log-item"><div class="log-badge">${ico('dumbbell')}</div><div class="grow"><div class="log-name">${esc(w.name)}</div><div class="log-sub">${fmtDate(w.finishedAt)} · ${setsOf(w).length} подх. · ${w.exercises.length} упр.</div></div><div class="right"><div class="log-name">${formatVolume(volume(w))}</div><div class="log-sub">тоннаж</div></div></div>`}
 function workout(){if(!data.active)return `<div class="eyebrow">НОВАЯ ТРЕНИРОВКА</div><h1>Время тренироваться.</h1><p class="subtitle">Выбери готовый план или создай свою тренировку.</p><div class="templates">${presets.map((p,i)=>`<button class="template" data-action="start" data-index="${i}"><span class="template-icon">${ico(p.icon)}</span><span class="template-info grow"><strong>${p.name}</strong><span>${p.desc}</span></span><span class="chevron">${ico('arrow')}</span></button>`).join('')}</div><p class="note" style="margin-top:15px">Планы можно менять: добавляй или удаляй упражнения и подходы.</p>`;
 const w=data.active;return `<div class="session-top"><div><div class="eyebrow">ТРЕНИРОВКА ИДЁТ</div><h1 style="margin-bottom:6px">${esc(w.name)}</h1><div class="session-time">${ico('clock')} Начало в ${fmtTime(w.startedAt)}</div><div class="session-title-tools"><button class="muted-link" data-action="rename-workout">✎ Изменить название</button></div></div><button class="btn btn-ghost mini-btn" data-action="discard">Отменить</button></div><div class="rest-panel"><div class="rest-head"><div><div class="rest-label">${ico('clock')} Таймер отдыха</div><span class="tiny" id="restStatus">Выбери время для отдыха</span></div><div class="rest-time" id="restTime">${restClock(restRemaining())}</div></div><div class="rest-controls"><button data-action="rest-start" data-seconds="60">1 мин</button><button data-action="rest-start" data-seconds="90">1:30</button><button data-action="rest-start" data-seconds="120">2 мин</button></div><div class="rest-actions"><button data-action="rest-add">+30 секунд</button><button data-action="rest-stop">Сбросить</button></div></div><div class="row" style="margin-bottom:14px"><span class="tiny">${w.exercises.length} упражнений</span><span class="tag" id="setCounter">${setsOf(w).length} заполнено</span></div>${w.exercises.map(exerciseCard).join('')}<button class="btn btn-muted btn-block" data-action="open-exercises">${ico('plus')} Добавить упражнение</button><div class="workout-sticky"><button class="btn btn-primary btn-block" data-action="finish">${ico('check')} Завершить тренировку</button></div><p class="note">Заполни вес и повторения. Галочка отмечает выполненный подход. При сохранении учитываются все заполненные подходы.</p>`}
 function exerciseCard(ex,i){return `<section class="exercise-card"><div class="exercise-head"><div class="grow"><h3>${esc(ex.name)}</h3><small>${ex.sets.length} подход${ex.sets.length===1?'':'а'}</small></div><button class="small-icon-btn" data-action="remove-ex" data-ex="${esc(ex.id)}" aria-label="Удалить упражнение">${ico('trash')}</button></div>${previousExercise(ex.name)?`<div class="previous-set">В прошлый раз (${fmtDate(previousExercise(ex.name).date)}): ${previousExercise(ex.name).ex.sets.filter(validSet).map(s=>`${fmtNum(Number(s.weight))} кг × ${fmtNum(Number(s.reps))}`).join(' · ')}</div>`:''}<div class="set-heading"><span>№</span><span>ВЕС (КГ)</span><span>ПОВТ.</span><span>✓</span></div>${ex.sets.map((s,j)=>`<div class="set-row"><span class="set-num">${j+1}</span><input class="set-input" type="number" inputmode="decimal" min="0" max="100000" step="0.5" placeholder="0" data-input="weight" data-ex="${esc(ex.id)}" data-set="${esc(s.id)}" value="${esc(s.weight)}" aria-label="Вес, подход ${j+1}"><input class="set-input" type="number" inputmode="numeric" min="1" max="100000" step="1" placeholder="0" data-input="reps" data-ex="${esc(ex.id)}" data-set="${esc(s.id)}" value="${esc(s.reps)}" aria-label="Повторы, подход ${j+1}"><button class="set-check ${s.done?'checked':''}" data-action="toggle-set" data-ex="${esc(ex.id)}" data-set="${esc(s.id)}" aria-label="Отметить выполненный подход">${ico('check')}</button></div>`).join('')}<div class="exercise-actions"><button class="add-set" data-action="add-set" data-ex="${esc(ex.id)}">${ico('plus')} Подход</button>${previousExercise(ex.name)?`<button class="reuse" data-action="fill-last" data-ex="${esc(ex.id)}">↻ Повторить прошлые</button>`:''}<button class="small-icon-btn" data-action="remove-last-set" data-ex="${esc(ex.id)}" aria-label="Удалить последний подход">− Последний</button></div></section>`}
 function history(){return `<div class="eyebrow">ЖУРНАЛ</div><h1>История тренировок</h1><p class="subtitle">Все тренировки остаются под рукой.</p>${data.sessions.length?data.sessions.map(w=>`<section class="panel" style="margin-bottom:12px"><button data-action="expand" data-id="${esc(w.id)}" style="padding:0;display:flex;gap:12px;align-items:center;color:inherit;background:none;border:none;text-align:left;width:100%"><div class="log-badge">${ico('calendar')}</div><div class="grow"><h3>${esc(w.name)}</h3><span class="tiny">${fmtFull(w.finishedAt)} · ${setsOf(w).length} подходов</span></div><div class="right"><strong>${formatVolume(volume(w))}</strong><div class="tiny">${expandedId===w.id?'Свернуть':'Подробнее'}</div></div></button>${expandedId===w.id?`<div class="history-details">${w.exercises.map(ex=>`<div class="detail-row"><div class="grow"><strong>${esc(ex.name)}</strong><div class="tiny">${ex.sets.map(s=>`${esc(fmtNum(Number(s.weight)))} кг × ${esc(s.reps)}`).join(' · ')}</div></div><span class="tag">${ex.sets.length}</span></div>`).join('')}<button class="btn btn-danger mini-btn" data-action="delete-session" data-id="${esc(w.id)}" style="margin-top:12px">${ico('trash')} Удалить запись</button></div>`:''}</section>`).join(''):`<div class="panel empty"><div class="empty-icon">${ico('calendar')}</div><h3>Пока пусто</h3><p>Заверши тренировку, чтобы она появилась в журнале.</p><button class="btn btn-primary mini-btn" data-action="nav" data-page="workout">Новая тренировка</button></div>`}`}
 function prs(){let r=new Map();for(const w of data.sessions){for(const ex of w.exercises)for(const s of ex.sets)if(validSet(s)){const max=r.get(ex.name)||0;r.set(ex.name,Math.max(max,Number(s.weight)));}}return [...r.entries()].sort((a,b)=>b[1]-a[1]);}
 function chartExercise(){const found=data.sessions.flatMap(w=>w.exercises.filter(ex=>ex.name===progressExercise).map(ex=>({date:w.finishedAt,max:Math.max(0,...ex.sets.filter(validSet).map(s=>Number(s.weight)))}))).filter(x=>x.max>=0).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-8);if(!found.length)return `<div class="empty" style="padding:16px"><p>Данных пока нет</p></div>`;const values=found.map(x=>x.max);const max=Math.max(5,...values),min=Math.max(0,Math.min(...values)-max*.18),range=Math.max(1,max-min);const coords=values.map((v,i)=>({x:20+(i/Math.max(1,values.length-1))*290,y:132-((v-min)/range)*103}));const pts=coords.map(p=>`${p.x},${p.y}`).join(' ');const area=`20,143 ${pts} ${coords[coords.length-1].x},143`;return `<svg class="progress-chart" viewBox="0 0 332 174" role="img" aria-label="График максимального рабочего веса"><line x1="20" y1="38" x2="315" y2="38" class="axis"/><line x1="20" y1="89" x2="315" y2="89" class="axis"/><line x1="20" y1="143" x2="315" y2="143" class="axis"/><polygon points="${area}" class="area"/><polyline points="${pts}" class="line"/>${coords.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="5" class="dot"><title>${esc(fmtDate(found[i].date))}: ${found[i].max} кг</title></circle>`).join('')}<text x="20" y="165">${esc(fmtDate(found[0].date))}</text><text x="315" y="165" text-anchor="end">${esc(fmtDate(found[found.length-1].date))}</text><text x="315" y="24" text-anchor="end">${fmtNum(max)} кг</text></svg><div class="tiny" style="text-align:center">Рабочий вес по последним ${found.length} тренировкам</div>`}
 function progress(){const records=prs();if(!progressExercise||!records.some(x=>x[0]===progressExercise))progressExercise=records.length?records[0][0]:'';const uniq=new Set(data.sessions.map(w=>new Date(w.finishedAt).toDateString())).size;return `<div class="eyebrow">АНАЛИТИКА</div><h1>Твой прогресс</h1><p class="subtitle">Каждый килограмм и каждое повторение имеют значение.</p><div class="stats"><div class="stat"><div class="stat-icon">${ico('trophy')}</div><strong>${records.length}</strong><small>упражнений с результатами</small></div><div class="stat"><div class="stat-icon">${ico('calendar')}</div><strong>${uniq}</strong><small>тренировочных дней</small></div></div><div class="section-title"><h2>Рост силовых</h2></div><div class="panel">${records.length?`<label class="label" for="exerciseSelect">Выбери упражнение</label><select id="exerciseSelect" class="select" style="margin:0" data-input="progress">${records.map(([name])=>`<option value="${esc(name)}" ${name===progressExercise?'selected':''}>${esc(name)}</option>`).join('')}</select>${chartExercise()}`:`<div class="empty"><div class="empty-icon">${ico('chart')}</div><h3>График появится здесь</h3><p>Сохрани первую тренировку с весами и повторениями.</p></div>`}</div><div class="section-title"><h2>Личные рекорды</h2><span class="tiny">По весу</span></div><div class="panel">${records.length?`<div class="pr-list">${records.map(([name,weight],i)=>`<div class="pr-item"><div class="grow"><span class="tiny">${i+1<10?'0':''}${i+1}</span> <strong style="font-size:12px">${esc(name)}</strong></div><span class="value">${fmtNum(weight)} кг</span></div>`).join('')}</div>`:`<div class="empty"><p>Рекордов пока нет.</p></div>`}</div><p class="note" style="margin-top:13px">Рекорд — максимальный записанный рабочий вес в упражнении, а не расчёт одноповторного максимума.</p>`}
 function settings(){return `<div class="eyebrow">НАСТРОЙКИ</div><h1>Данные и резервные копии</h1><p class="subtitle">Управляй историей тренировок.</p><div class="panel"><div class="settings-row"><strong>Экспорт истории</strong><small>Сохрани JSON-файл или скопируй резервную копию в заметки.</small><div class="row" style="flex-wrap:wrap"><button class="btn btn-muted mini-btn" data-action="export">${ico('download')} Скачать JSON</button><button class="btn btn-muted mini-btn" data-action="copy">Копировать данные</button></div></div><div class="settings-row"><strong>Восстановление</strong><small>Вставь ранее скопированный JSON. Это заменит текущую историю.</small><textarea id="backupText" class="backup-input" placeholder="Вставь сюда JSON из резервной копии"></textarea><button class="btn btn-muted mini-btn" data-action="import-text">Восстановить из текста</button><label class="btn btn-muted mini-btn" for="backupFile" style="display:inline-flex;margin-top:8px">${ico('download')} Выбрать JSON-файл</label><input id="backupFile" type="file" accept=".json,application/json" class="hidden"></div><div class="settings-row"><strong>Демо-данные</strong><small>Три примера тренировок для демонстрации приложения. Загружаются только по нажатию.</small><button class="btn btn-muted mini-btn" data-action="demo">Загрузить демо</button></div><div class="settings-row"><strong>Очистить историю</strong><small>Безвозвратно удалить сохранённые тренировки и текущую сессию.</small><button class="btn btn-danger mini-btn" data-action="clear">${ico('trash')} Удалить всё</button></div></div><div class="panel" style="margin-top:14px"><div class="row"><strong>Хранение данных</strong><span class="tag">Локально</span></div><p class="note">Данные хранятся на этом устройстве в памяти браузера Telegram. Между устройствами не синхронизируются. Переустановка Telegram или очистка данных приложения может стереть историю — регулярно делай резервные копии.</p>${storageOk?'':'<p class="note" style="color:var(--danger)">Не удалось записать данные в локальное хранилище!</p>'}</div>`}
 function render(){document.getElementById('header').innerHTML=`<div><div class="eyebrow">WORK HARD · TRACK SMART</div><div class="brand">GYM<span style="color:var(--accent)">.</span>TRACKER</div></div><button class="header-icon" data-action="nav" data-page="settings" aria-label="Настройки">${ico('settings')}</button>`;document.getElementById('main').innerHTML=({home,workout,history,progress,settings}[page]||home)();document.getElementById('tabbar').innerHTML=[['home','Главная','home'],['workout','Тренировка','dumbbell'],['history','История','calendar'],['progress','Прогресс','chart']].map(([p,label,ic])=>`<button class="tab ${page===p?'active':''}" data-action="nav" data-page="${p}" ${page===p?'aria-current="page"':''}><span class="tab-icon">${ico(ic)}</span><span>${label}</span></button>`).join('');syncRestTimer()}
 function goto(p){page=p;expandedId='';haptic();render();window.scrollTo({top:0,behavior:'instant'});}
 function confirmAction(text,cb){if(window.confirm(text))cb();}
 function newExercise(name){return {id:id(),name,sets:[{id:id(),weight:'',reps:'',done:false}]}}
 function start(index){const preset=presets[index];if(!preset)return;data.active={id:id(),name:preset.name,startedAt:new Date().toISOString(),exercises:preset.items.map(i=>newExercise(options[i]))};persist();haptic('medium');render()}
 function getEx(exId){return data.active&&data.active.exercises.find(e=>e.id===exId)}
 function openExercises(){modalMode='add';document.getElementById('modal').className='modal-backdrop';document.getElementById('modal').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Добавить упражнение"><div class="sheet-handle"></div><div class="row"><h2>Добавить упражнение</h2><button class="btn btn-ghost" data-action="close-modal">Закрыть</button></div><input id="customExercise" class="field" maxlength="90" placeholder="Или своё название упражнения"><button class="btn btn-primary btn-block" data-action="add-custom">${ico('plus')} Добавить своё</button><div class="section-title"><h3>Быстрый выбор</h3></div><input id="exerciseSearch" type="search" class="field" placeholder="Поиск по упражнениям" autocomplete="off" aria-label="Поиск упражнения"><div id="exerciseChoices">${options.map((name,i)=>`<button class="sheet-item" data-action="add-option" data-index="${i}" data-search="${esc(name.toLocaleLowerCase('ru'))}"><span>${esc(name)}</span><span style="color:var(--accent)">${ico('plus')}</span></button>`).join('')}</div><div class="exercise-search-empty hidden" id="exerciseSearchEmpty">Ничего не найдено — добавь своё упражнение выше.</div></div>`}
 function closeModal(){modalMode='';document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}
 function addExercise(name){name=String(name).trim();if(!name)return notify('Введи название упражнения');if(name.length>90)return notify('Название слишком длинное');data.active.exercises.push(newExercise(name));persist();closeModal();haptic();render();}
 function finish(){const w=data.active;if(!w)return;const cleaned=w.exercises.map(ex=>({...ex,sets:ex.sets.filter(validSet).map(s=>({...s,done:true}))})).filter(ex=>ex.sets.length);if(!cleaned.length){notify('Заполни хотя бы один подход: вес и повторы');return}const count=cleaned.reduce((a,ex)=>a+ex.sets.length,0);confirmAction(`Сохранить тренировку?\n${cleaned.length} упражнений, ${count} подходов.`,()=>{data.sessions.unshift({...w,finishedAt:new Date().toISOString(),exercises:cleaned});data.active=null;stopRest();persist();haptic('heavy');notify('Тренировка сохранена!');goto('history')})}
 function exportJson(){const json=JSON.stringify(data,null,2);try{const blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gym-tracker-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('Резервная копия создана');}catch(e){notify('Не удалось скачать — используй «Копировать данные»')}}
 async function copyJson(){const content=JSON.stringify(data);try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(content);notify('JSON скопирован в буфер обмена');}else{const t=document.getElementById('backupText');t.value=content;t.focus();t.select();notify('Скопируй выделенный текст вручную')}}catch(e){const t=document.getElementById('backupText');t.value=content;t.focus();t.select();notify('Скопируй выделенный текст вручную')}}
 function importJson(txt){try{const obj=JSON.parse(txt);validateWorkouts(obj);if(obj.active!==null&&obj.active!==undefined){if(typeof obj.active!=='object'||!Array.isArray(obj.active.exercises))throw Error('Некорректная сессия')}confirmAction('Заменить текущие данные резервной копией?',()=>{data={version:1,sessions:obj.sessions,active:obj.active||null};stopRest();persist();notify('Данные восстановлены');render()});}catch(e){notify('Ошибка: '+e.message)}}
 function demo(){confirmAction('Добавить 3 демонстрационные тренировки? Твои данные не удалятся.',()=>{const dates=[6,3,1];const workouts=dates.map((ago,i)=>{const d=new Date();d.setDate(d.getDate()-ago);const exes=[{name:'Жим в тренажёре',max:[35,40,45][i]},{name:'Тяга верхнего блока',max:[40,45,50][i]},{name:'Разведения гантелей в стороны',max:[7.5,8,9][i]}];return {id:id(),name:'Верх тела · ДЕМО',startedAt:new Date(d.getTime()-45*60000).toISOString(),finishedAt:d.toISOString(),exercises:exes.map(({name,max})=>({id:id(),name,sets:[12,10,8].map((reps,j)=>({id:id(),reps,weight:Math.max(0,max-(2-j)*(max>15?5:1)),done:true}))}))}});data.sessions=[...workouts,...data.sessions].sort((a,b)=>new Date(b.finishedAt)-new Date(a.finishedAt));persist();notify('Демо-тренировки добавлены');goto('home')})}
 document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el){if(e.target.id==='modal')closeModal();return}const action=el.dataset.action,exId=el.dataset.ex,setId=el.dataset.set;switch(action){case 'nav':goto(el.dataset.page);break;case 'start':start(Number(el.dataset.index));break;case 'rest-start':beginRest(Number(el.dataset.seconds));break;case 'rest-add':beginRest(restRemaining()+30);break;case 'rest-stop':stopRest();break;case 'rename-workout':{if(!data.active)return;const name=window.prompt('Название тренировки',data.active.name);if(name===null)break;const value=name.trim();if(!value||value.length>90){notify('Название должно быть от 1 до 90 символов');break}data.active.name=value;persist();render();break}case 'fill-last':{const ex=getEx(exId);if(!ex)return;const prev=previousExercise(ex.name);if(!prev)return notify('Нет предыдущих подходов');const apply=()=>{ex.sets=prev.ex.sets.filter(validSet).map(s=>({id:id(),weight:String(s.weight),reps:String(s.reps),done:false}));persist();render();notify('Прошлые подходы перенесены')};if(ex.sets.some(validSet))confirmAction('Заменить заполненные подходы прошлыми результатами?',apply);else apply();break}case 'discard':confirmAction('Отменить тренировку? Несохранённые подходы пропадут.',()=>{data.active=null;stopRest();persist();render()});break;case 'open-exercises':openExercises();break;case 'close-modal':closeModal();break;case 'add-custom':addExercise(document.getElementById('customExercise').value);break;case 'add-option':addExercise(options[Number(el.dataset.index)]);break;case 'remove-ex':confirmAction('Удалить упражнение из тренировки?',()=>{data.active.exercises=data.active.exercises.filter(ex=>ex.id!==exId);persist();render()});break;case 'add-set':{const ex=getEx(exId);if(!ex)return;const last=ex.sets[ex.sets.length-1];ex.sets.push({id:id(),weight:last?last.weight:'',reps:last?last.reps:'',done:false});persist();haptic();render();break}case 'remove-last-set':{const ex=getEx(exId);if(!ex||!ex.sets.length)return;ex.sets.pop();persist();render();break}case 'toggle-set':{const ex=getEx(exId);if(!ex)return;const set=ex.sets.find(s=>s.id===setId);if(!set)return;if(!validSet(set))return notify('Сначала введи вес и повторы');set.done=!set.done;el.classList.toggle('checked',set.done);haptic('light');persist();break}case 'finish':finish();break;case 'expand':expandedId=expandedId===el.dataset.id?'':el.dataset.id;render();break;case 'delete-session':confirmAction('Удалить эту тренировку навсегда?',()=>{data.sessions=data.sessions.filter(w=>w.id!==el.dataset.id);expandedId='';persist();render()});break;case 'export':exportJson();break;case 'copy':copyJson();break;case 'import-text':importJson(document.getElementById('backupText').value.trim());break;case 'demo':demo();break;case 'clear':confirmAction('Удалить ВСЕ тренировки и текущую сессию? Это нельзя отменить.',()=>{data={version:1,sessions:[],active:null};stopRest();persist();notify('Данные очищены');goto('home')});break;}});
 document.addEventListener('input',e=>{const el=e.target;if(el.id==='exerciseSearch'){const query=el.value.trim().toLocaleLowerCase('ru');let found=0;document.querySelectorAll('#exerciseChoices [data-search]').forEach(b=>{const match=b.dataset.search.includes(query);b.classList.toggle('hidden',!match);if(match)found++;});const msg=document.getElementById('exerciseSearchEmpty');if(msg)msg.classList.toggle('hidden',found>0);return;}const field=el.dataset.input;if(!field||field==='progress'||!data.active)return;const ex=getEx(el.dataset.ex);if(!ex)return;const s=ex.sets.find(s=>s.id===el.dataset.set);if(!s)return;let value=el.value.replace(',','.');if(value===''){s[field]='';}else{const n=Number(value);if(!Number.isFinite(n)||n<0||n>100000)return;s[field]=value;}if(s.done){s.done=false;const btn=el.parentElement.querySelector('.set-check');if(btn)btn.classList.remove('checked');}persist();const counter=document.getElementById('setCounter');if(counter)counter.textContent=setsOf(data.active).length+' заполнено';});
 document.addEventListener('change',async e=>{if(e.target.dataset.input==='progress'){progressExercise=e.target.value;render();return}if(e.target.id==='backupFile'&&e.target.files[0]){const f=e.target.files[0];if(f.size>5*1024*1024)return notify('Файл слишком большой');try{importJson(await f.text())}catch(err){notify('Не удалось прочитать файл')}e.target.value=''}});
 render();
})();
</script>
</body>
</html>
